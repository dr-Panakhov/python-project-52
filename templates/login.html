{% extends 'base.html' %}
{% block content %}
<h1 class="text-3xl font-bold mb-6">Вход</h1>
<form method="post" class="max-w-2xl">
    {% csrf_token %}
    <div class="space-y-4">
        {% for field in form %}
        <div>
            <label class="block text-gray-700 mb-2" for="{{ field.id_for_label }}">{{ field.label }}:</label>
            <div class="*:w-full *:border-gray-300 *:rounded">
                {{ field }}
            </div>
            {% if field.help_text %}
            <div class="text-sm text-gray-500 mt-1">{{ field.help_text|safe }}</div>
            {% endif %}
            {% for error in field.errors %}
            <div class="text-red-500 text-sm mt-1">{{ error }}</div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">Войти</button>
</form>
{% endblock %}
