{% extends 'base.html' %}
{% block content %}
<h1 class="text-3xl font-bold mb-6">Удаление пользователя</h1>
<p class="mb-4">Вы уверены, что хотите удалить {{ object.first_name }} {{ object.last_name }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Да, удалить</button>
</form>
{% endblock %}
